
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3 - Number Generator</title>
</head>
<body>

    <button id="generateBtn" type="button">Generate</button>

    <ol id="numberList"></ol>

    <script>
        // Select the button and ordered list
        const generateBtn = document.getElementById("generateBtn");
        const numberList = document.getElementById("numberList");

        // Define the function
        function generateNumbers() {
            // Clear existing list items
            numberList.replaceChildren();

            // Generate numbers from 1 to 5
            for (let i = 1; i <= 5; i++) {
                // Create a new list item
                const listItem = document.createElement("li");

                // Set the text of the list item
                listItem.textContent = "The number is " + i;

                // Add the list item to the ordered list
                numberList.appendChild(listItem);
            }
        }

        // Add click event listener
        generateBtn.addEventListener("click", generateNumbers);
    </script>

</body>
</html>

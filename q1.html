
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - Text Changer</title>
</head>
<body>

    <div id="myElement">
        <p id="message">Welcome to my website!</p>
    </div>

    <button id="changeBtn" type="button">Change Message</button>

    <script>
        // Select the paragraph and button
        const message = document.getElementById("message");
        const changeBtn = document.getElementById("changeBtn");

        // Define the function
        function changeMessage() {
            message.textContent = "Hello there!";
        }

        // Add click event listener
        changeBtn.addEventListener("click", changeMessage);
    </script>

</body>
</html>
